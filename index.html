<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiên Thư Các - Kho Nguồn Sách & Tiện Ích</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.4);
            --card-hover-border: rgba(59, 130, 246, 0.4);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-primary: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --accent-success: #10b981;
            --accent-success-glow: rgba(16, 185, 129, 0.2);
            --accent-warn: #f59e0b;
            --accent-warn-glow: rgba(245, 158, 11, 0.2);
            --accent-purple: #8b5cf6;
            --accent-purple-glow: rgba(139, 92, 246, 0.2);
            --accent-pink: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 3rem 1.5rem;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.1) 0%, transparent 45%),
                linear-gradient(rgba(255, 255, 255, 0.003) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.003) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
            background-attachment: fixed;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
            position: relative;
        }

        header .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 100px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
            z-index: -1;
            filter: blur(20px);
        }

        header h1 {
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 10%, #a5b4fc 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.75rem;
            text-shadow: 0 0 40px rgba(99, 102, 241, 0.2);
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.25rem;
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
        }

        .actions-panel {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .search-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 280px;
        }

        .search-box input {
            width: 100%;
            padding: 0.9rem 1.25rem 0.9rem 3rem;
            background: rgba(8, 12, 24, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-box input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px var(--accent-glow);
            background: rgba(8, 12, 24, 0.9);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            opacity: 0.5;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.25rem;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            padding: 0.6rem 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-secondary);
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .tab-btn.active {
            color: white;
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-bulk {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.9rem 1.8rem;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: none;
        }

        .btn-bulk-indigo {
            background: linear-gradient(135deg, #4f46e5, #3730a3);
            color: white;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3);
        }

        .btn-bulk-indigo:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(79, 70, 229, 0.45);
        }

        .btn-bulk-emerald {
            background: linear-gradient(135deg, #059669, #064e3b);
            color: white;
            box-shadow: 0 4px 20px rgba(5, 150, 105, 0.3);
        }

        .btn-bulk-emerald:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(5, 150, 105, 0.45);
        }

        .btn-bulk-blue {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
        }

        .btn-bulk-blue:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(37, 99, 235, 0.45);
        }

        .btn-bulk:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            user-select: none;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .checkbox-container input[type="checkbox"] {
            width: 1.15rem;
            height: 1.15rem;
            accent-color: var(--accent-primary);
            cursor: pointer;
        }

        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 0 0.5rem;
        }

        .grid-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .grid-header .count-badge {
            font-size: 0.9rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.04);
            padding: 0.3rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.015) 0%, transparent 100%);
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--card-hover-border);
            box-shadow: 0 12px 30px rgba(59, 130, 246, 0.12), 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .card.selected {
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(59, 130, 246, 0.04);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.08);
        }

        .card-header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex: 1;
        }

        .card-checkbox {
            width: 1.15rem;
            height: 1.15rem;
            accent-color: var(--accent-primary);
            cursor: pointer;
            margin-top: 0.15rem;
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .card-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 11px;
        }

        .card-details h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            line-height: 1.3;
        }

        .card-details .author {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.15rem;
        }

        .badges {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .badge-novel {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .badge-comic {
            background: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .badge-video {
            background: rgba(139, 92, 246, 0.1);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .badge-tts {
            background: rgba(236, 72, 153, 0.1);
            color: #f472b6;
            border: 1px solid rgba(236, 72, 153, 0.2);
        }

        .badge-lang {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .card-body {
            flex-grow: 1;
            margin-bottom: 1.5rem;
        }

        .comment {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.5;
            margin-bottom: 0.75rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .url-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.4rem 0.6rem;
            font-family: monospace;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .url-box:hover {
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.6);
        }

        .url-box span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 0.5rem;
        }

        .url-box::after {
            content: "📋";
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .card-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: auto;
        }

        .card-buttons.single-btn {
            grid-template-columns: 1fr;
        }

        .btn-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            padding: 0.65rem 0.5rem;
            text-align: center;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .btn-install-source {
            background: rgba(59, 130, 246, 0.08);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.15);
        }

        .btn-install-source:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .btn-install-extension {
            background: rgba(16, 185, 129, 0.08);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.15);
        }

        .btn-install-extension:hover {
            background: var(--accent-success);
            color: white;
            border-color: var(--accent-success);
            box-shadow: 0 0 12px var(--accent-success-glow);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-primary);
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-glow);
            font-weight: 500;
            font-size: 0.95rem;
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        footer {
            margin-top: 6rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 300;
        }

        footer strong {
            color: white;
            font-weight: 500;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2.4rem;
            }
            body {
                padding: 2rem 1rem;
            }
            .actions-panel {
                padding: 1.25rem;
                border-radius: 20px;
            }
            .search-row {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-group {
                flex-direction: column;
            }
            .btn-bulk {
                width: 100%;
            }
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-glow"></div>
            <h1>Thiên Thư Các</h1>
            <p>Kho Lưu Trữ Tiện Ích Mở Rộng & Nguồn Sách Legado</p>
        </header>

        <div class="actions-panel">
            <div class="search-row">
                <div class="search-box">
                    <input type="text" id="search" placeholder="Tìm kiếm nguồn hoặc mô tả..." oninput="filterList()">
                </div>
                <div class="checkbox-container" onclick="toggleSelectAll()">
                    <input type="checkbox" id="select-all" onclick="event.stopPropagation(); handleSelectAllChange(this.checked)">
                    <span>Chọn tất cả hiển thị</span>
                </div>
            </div>

            <div class="search-row" style="justify-content: space-between;">
                <div class="tabs" id="type-tabs">
                    <button class="tab-btn active" onclick="setTab('all', this)">Tất cả</button>
                    <button class="tab-btn" onclick="setTab('novel', this)">Tiểu thuyết</button>
                    <button class="tab-btn" onclick="setTab('comic', this)">Truyện tranh</button>
                    <button class="tab-btn" onclick="setTab('video', this)">Video / Phim</button>
                    <button class="tab-btn" onclick="setTab('tts', this)">Giọng đọc TTS</button>
                </div>

                <div class="btn-group">
                    <button id="btn-install-selected" class="btn-bulk btn-bulk-indigo" onclick="installSelectedSources()" disabled>
                        <span>📥</span> Cài đặt đã chọn (0)
                    </button>
                    <a href="legado://import/extensionRepo?src=https%3A%2F%2Fraw.githubusercontent.com%2Fhongtrantiende%2FExtransion-TTC%2Fmain%2Fplugin.json" class="btn-bulk btn-bulk-emerald">
                        <span>🔌</span> Thêm kho Tiện ích
                    </a>
                    <a href="legado://import/importonline?src=https://raw.githubusercontent.com/hongtrantiende/Extransion-TTC/main/sources.json" class="btn-bulk btn-bulk-blue">
                        <span>📚</span> Cài tất cả nguồn sách
                    </a>
                </div>
            </div>
        </div>

        <div class="grid-header">
            <h2 id="grid-title">Tất cả tài nguyên</h2>
            <div class="count-badge" id="count-badge">Hiển thị: 0/0</div>
        </div>

        <div class="grid" id="grid">
            <!-- Rendered dynamically -->
        </div>

        <footer>
            <p>&copy; 2026 <strong>Thiên Thư Các</strong>. Phát triển và chia sẻ bởi cộng đồng Legado Việt Nam.</p>
        </footer>
    </div>

    <div class="toast" id="toast">Đã sao chép liên kết!</div>

        let currentTab = 'all';
        let searchQuery = '';
        const selectedIds = new Set();

        function getSlug(name) {
            return name.toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/đ/g, "d")
                .replace(/[^a-z0-9]/g, "-")
                .replace(/-+/g, "-")
                .replace(/(^-|-$)/g, "");
        }

        function getIconChar(name, type) {
            if (type === 'comic' || type === 'manga' || type === 'image') return '🎨';
            if (type === 'video') return '🎬';
            if (type === 'tts') return '🗣️';
            return '📖';
        }

        function renderList() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            let filtered = sourcesData.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchQuery) || 
                                     item.description.toLowerCase().includes(searchQuery) ||
                                     item.source.toLowerCase().includes(searchQuery);
                
                let matchesTab = true;
                if (currentTab === 'novel') {
                    matchesTab = item.type === 'novel';
                } else if (currentTab === 'comic') {
                    matchesTab = item.type === 'comic' || item.type === 'manga' || item.type === 'image';
                } else if (currentTab === 'video') {
                    matchesTab = item.type === 'video';
                } else if (currentTab === 'tts') {
                    matchesTab = item.type === 'tts';
                }

                return matchesSearch && matchesTab;
            });

            // Update count badge
            document.getElementById('count-badge').textContent = `Hiển thị: ${filtered.length}/${sourcesData.length}`;

            // Check if select-all should be checked
            const selectAllCheckbox = document.getElementById('select-all');
            if (filtered.length > 0) {
                const allFilteredSelected = filtered.every(item => selectedIds.has(item.name));
                selectAllCheckbox.checked = allFilteredSelected;
            } else {
                selectAllCheckbox.checked = false;
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-secondary); background: var(--card-bg); border-radius: 20px; border: 1px dashed var(--border-color);">Không tìm thấy tài nguyên nào phù hợp.</div>`;
                return;
            }

            filtered.forEach(item => {
                const isSelected = selectedIds.has(item.name);
                const card = document.createElement('div');
                card.className = `card${isSelected ? ' selected' : ''}`;
                card.id = `card-${getSlug(item.name)}`;
                card.onclick = () => toggleSelectCard(item.name);

                const typeLabel = item.type === 'novel' ? 'Tiểu thuyết' : 
                                  (item.type === 'comic' || item.type === 'manga' || item.type === 'image' ? 'Truyện tranh' : 
                                  (item.type === 'video' ? 'Video/Phim' : 
                                  (item.type === 'tts' ? 'Giọng đọc' : item.type)));
                
                const typeBadgeClass = item.type === 'novel' ? 'badge-novel' : 
                                       (item.type === 'comic' || item.type === 'manga' || item.type === 'image' ? 'badge-comic' : 
                                       (item.type === 'video' ? 'badge-video' : 
                                       (item.type === 'tts' ? 'badge-tts' : 'badge-lang')));

                const rawSourceUrl = item.source || 'N/A';
                const comments = item.description || 'Không có mô tả.';

                const extImportUrl = item.path ? `legado://import/extension?src=${encodeURIComponent(item.path)}` : '';
                const bookSourceUrl = `https://raw.githubusercontent.com/hongtrantiende/Extransion-TTC/main/sources/${item.filename}`;
                const srcImportUrl = `legado://import/importonline?src=&{encodeURIComponent(bookSourceUrl)}`;

                let iconContent = `<span>${getIconChar(item.name, item.type)}</span>`;
                if (item.icon) {
                    iconContent = `<img src="${item.icon}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                   <span style="display:none;">${getIconChar(item.name, item.type)}</span>`;
                }

                card.innerHTML = `
                    <div class="card-header-top">
                        <div class="card-title-group">
                            <input type="checkbox" class="card-checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelectCard('${item.name.replace(/'/g, "\\'")}')">
                            <div class="card-icon">
                                ${iconContent}
                            </div>
                            <div class="card-details">
                                <h3>${escapeHtml(item.name)}</h3>
                                <div class="author">Tác giả: ${escapeHtml(item.author)}</div>
                            </div>
                        </div>
                    </div>
                    <div class="badges">
                        <span class="badge ${typeBadgeClass}">${typeLabel}</span>
                        <span class="badge badge-lang">${item.locale.toUpperCase()}</span>
                        <span class="badge badge-lang">v${item.version}</span>
                    </div>
                    <div class="card-body">
                        <p class="comment" title="${escapeHtml(comments)}">${escapeHtml(comments)}</p>
                        <div class="url-box" title="Click để sao chép liên kết nguồn gốc" onclick="event.stopPropagation(); copyLink('${rawSourceUrl.replace(/'/g, "\\'")}')">
                            <span>${escapeHtml(rawSourceUrl)}</span>
                        </div>
                    </div>
                    <div class="card-buttons">
                        <a href="${srcImportUrl}" class="btn-card btn-install-source" onclick="event.stopPropagation();" title="Nhấn để cài đặt Nguồn Sách vào ứng dụng Legado">Cài nguồn</a>
                        ${item.path ? `<a href="${extImportUrl}" class="btn-card btn-install-extension" onclick="event.stopPropagation();" title="Nhấn để cài đặt Tiện Ích JS vào ứng dụng">Cài tiện ích</a>` : `<span class="btn-card" style="opacity:0.3; background:rgba(255,255,255,0.02); color:var(--text-secondary); cursor:not-allowed;">Không zip</span>`}
                    </div>
                `;
                grid.appendChild(card);
            });

            updateBulkButtonState();
        }

        function toggleSelectCard(name) {
            if (selectedIds.has(name)) {
                selectedIds.delete(name);
            } else {
                selectedIds.add(name);
            }
            renderList();
        }

        function handleSelectAllChange(checked) {
            const filtered = getFilteredData();
            if (checked) {
                filtered.forEach(item => selectedIds.add(item.name));
            } else {
                filtered.forEach(item => selectedIds.delete(item.name));
            }
            renderList();
        }

        function toggleSelectAll() {
            const checkbox = document.getElementById('select-all');
            checkbox.checked = !checkbox.checked;
            handleSelectAllChange(checkbox.checked);
        }

        function getFilteredData() {
            return sourcesData.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchQuery) || 
                                     item.description.toLowerCase().includes(searchQuery) ||
                                     item.source.toLowerCase().includes(searchQuery);
                
                let matchesTab = true;
                if (currentTab === 'novel') {
                    matchesTab = item.type === 'novel';
                } else if (currentTab === 'comic') {
                    matchesTab = item.type === 'comic' || item.type === 'manga' || item.type === 'image';
                } else if (currentTab === 'video') {
                    matchesTab = item.type === 'video';
                } else if (currentTab === 'tts') {
                    matchesTab = item.type === 'tts';
                }

                return matchesSearch && matchesTab;
            });
        }

        function updateBulkButtonState() {
            const btn = document.getElementById('btn-install-selected');
            const count = selectedIds.size;
            btn.innerHTML = `<span>📥</span> Cài đặt đã chọn (${count})`;
            btn.disabled = count === 0;
        }

        function installSelectedSources() {
            if (selectedIds.size === 0) return;
            
            // Build list of selected book sources
            const selectedSources = [];
            sourcesData.forEach(item => {
                if (selectedIds.has(item.name)) {
                    // Create mock book source details
                    const isComic = item.type === 'comic' || item.type === 'manga' || item.type === 'image';
                    selectedSources.push({
                        bookSourceComment: `Tác giả: ${item.author}. ${item.description}`.trim(),
                        bookSourceGroup: "Extension",
                        bookSourceName: item.name,
                        bookSourceType: isComic ? 2 : 0,
                        bookSourceUrl: `ext_${item.id}`,
                        customButton: false,
                        customOrder: 0,
                        enabled: true,
                        enabledCookieJar: true,
                        enabledExplore: true,
                        eventListener: false,
                        lastUpdateTime: Date.now(),
                        respondTime: 180000,
                        ruleBookInfo: {},
                        ruleContent: {},
                        ruleExplore: {},
                        ruleSearch: {},
                        ruleToc: {},
                        searchUrl: "",
                        weight: 0
                    });
                }
            });

            // Convert to JSON and stringify
            const jsonStr = JSON.stringify(selectedSources);
            
            // Generate deep link using the raw JSON string
            const deepLink = `legado://import/importonline?src=${encodeURIComponent(jsonStr)}`;
            
            // Open the deep link
            window.location.href = deepLink;
        }

        function setTab(tab, element) {
            currentTab = tab;
            
            // Update active state in tabs UI
            const tabButtons = document.querySelectorAll('#type-tabs .tab-btn');
            tabButtons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            // Update title
            const titles = {
                all: 'Tất cả tài nguyên',
                novel: 'Nguồn Tiểu Thuyết',
                comic: 'Nguồn Truyện Tranh',
                video: 'Nguồn Video / Phim',
                tts: 'Giọng đọc văn bản TTS'
            };
            document.getElementById('grid-title').textContent = titles[tab] || 'Tài nguyên';

            renderList();
        }

        function filterList() {
            searchQuery = document.getElementById('search').value.toLowerCase().trim();
            renderList();
        }

        function copyLink(text) {
            if (!text || text === 'N/A') return;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            });
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initial render
        renderList();
    </script>
</body>
</html>
